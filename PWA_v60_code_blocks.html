.stats-period-control{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px}
.stats-period-button{min-width:0;padding:8px 7px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:10px;font-weight:650;cursor:pointer;white-space:nowrap}
.stats-period-button.active{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:var(--shadow)}
.stats-overview-divider{height:1px;background:var(--border);margin:17px 0 16px}
.stats-summary-heading{margin-bottom:11px}
.stats-summary-heading .stats-demo-tag{margin-left:auto}
.stats-summary-grid{margin:0 0 21px;gap:8px}
.stats-summary-item{min-height:91px;align-content:center;padding:11px 10px}
.stats-summary-item span{font-size:10px}
.stats-summary-item strong{font-size:23px}
.stats-group-heading{margin-top:22px}
.stats-card-list{gap:11px}
.stats-overview-card{padding:17px}
.stats-card-title b{font-size:13px}

/* Weight chart refinement from v57 baseline: readable axes, target line, proportional sizing. */
.stats-page-head{display:block;margin:0 0 18px}
.stats-period-control{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px}

.stats-line-chart svg{display:block;width:100%;height:auto;aspect-ratio:640 / 220;overflow:visible}
.stats-line-grid{stroke:var(--border);stroke-width:1;opacity:.8}
.stats-line-axis-text{fill:var(--muted);font-size:10px;font-family:inherit}
.stats-line-target{stroke:var(--muted-2);stroke-width:1.4;stroke-dasharray:5 5;opacity:.9}
.stats-line-target-label{fill:var(--muted);font-size:9px;font-family:inherit}
.stats-line-path{fill:none;stroke:var(--text);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.stats-line-dot{fill:var(--surface);stroke:var(--text);stroke-width:2.2}

/* Match the statistics card anatomy from the agreed UI concept. */
.stats-summary-item{display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:2px;align-content:center}
.stats-summary-item .stats-summary-icon{grid-row:1 / span 2;align-self:start;display:grid;place-items:center;width:21px;height:21px;border-radius:7px;font-size:13px;font-weight:800;background:var(--surface);border:1px solid var(--border)}
.stats-summary-item>span:not(.stats-summary-icon){align-self:end}
.stats-summary-item strong,.stats-summary-item small{grid-column:2}
.stats-card-title{gap:10px}
.stats-card-icon{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font-size:16px;font-weight:800}

.stats-variety-grid{grid-template-columns:1fr;gap:11px;margin-top:14px}
.stats-micro-grid{grid-template-columns:1fr;gap:0;margin-top:12px}
.stats-micro-item{background:transparent;border-radius:0;padding:9px 0;border-bottom:1px solid var(--border);font-size:10px}
.stats-micro-item:last-child{border-bottom:0}
.stats-measures-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats-line-chart{width:min(100%,680px);margin:16px auto 2px;padding:0}
.stats-line-chart svg{display:block;width:100%;height:auto !important;aspect-ratio:680 / 280;overflow:visible}
.stats-line-grid{stroke:var(--border);stroke-width:1;opacity:.78}
.stats-line-axis-text{fill:var(--muted);font-size:10px;font-family:inherit}
.stats-line-target{stroke:var(--warm);stroke-width:1.5;stroke-dasharray:5 5;opacity:.9}
.stats-line-target-label{fill:var(--warm);font-size:10px;font-family:inherit}
.stats-line-area{fill:var(--good-soft);opacity:.72}
.stats-line-path{fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stats-line-dot{fill:var(--surface);stroke:var(--good);stroke-width:2.5}

/* Weight chart v60: fill the card width; no centered narrow canvas. */
.stats-line-chart{display:block;width:100%;max-width:none;margin:12px 0 0;padding:0;min-width:0}

function calculateProfileAge(birthDate,referenceDate=todayLocalDate()){
 if(!birthDate)return null;
 const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(birthDate);if(!match)return null;
 const year=Number(match[1]),month=Number(match[2]),day=Number(match[3]);const date=new Date(year,month-1,day);
 if(date.getFullYear()!==year||date.getMonth()!==month-1||date.getDate()!==day||date>referenceDate)return null;
 let age=referenceDate.getFullYear()-year;if(referenceDate.getMonth()+1<month||(referenceDate.getMonth()+1===month&&referenceDate.getDate()<day))age--;
 return age>=0?age:null;
}

function translateText(text){
 if(appLocale==='ru'||text==null)return String(text??'');
 const raw=String(text);
 // 1) точные фразы (регистронезависимый поиск по нижнему регистру)
 const exact=UI_TRANSLATIONS[raw.toLowerCase()];
 if(exact&&exact[appLocale]!=null){
  const res=exact[appLocale];
  return /^[А-ЯЁA-Z]/.test(raw)&&res?res[0].toUpperCase()+res.slice(1):res;
 }
 // 2) замена известных слов и устойчивых выражений (длинные варианты сначала)
 let out=raw;
 for(const phrase of UI_PHRASES){
  const entry=UI_TRANSLATIONS[phrase];
  if(!entry)continue;
  const rx=new RegExp(phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  out=out.replace(rx,match=>{
   let res=entry[appLocale];
   if(!res)return match;
   if(match[0]===match[0].toUpperCase())res=res[0].toUpperCase()+res.slice(1);
   return res;
  });
 }
 return out;
}

 while(walker.nextNode()){const n=walker.currentNode;if(n.nodeValue&&/[А-Яа-яЁё]/.test(n.nodeValue))nodes.push(n)}
 for(const node of nodes){
  const trimmed=node.nodeValue.trim();
  if(trimmed){const translated=translateText(trimmed);if(translated!==trimmed)node.nodeValue=node.nodeValue.replace(trimmed,translated)}
 }
 scope.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el=>{
  ['title','aria-label','placeholder'].forEach(attr=>{
   if(!el.hasAttribute(attr))return;
   const value=el.getAttribute(attr);

 });

function getRdaAgeBand(age){if(age>=9&&age<=13)return '9-13';if(age<=18)return '14-18';if(age<=30)return '19-30';if(age<=50)return '31-50';if(age<=70)return '51-70';return '71+'}
function calculatePlanTargets(){
 const age=calculateProfileAge(profile.birthDate),weight=Number(profile.currentWeight),height=Number(profile.height),factor=Number(profile.activityFactor);
 if(age===null||age<19||age>78||!['Мужской','Женский'].includes(profile.sex)||!(weight>0)||!(height>0)||!PROFILE_ACTIVITY_LEVELS.some(item=>Math.abs(item.factor-factor)<0.001))return null;
 const bmr=10*weight+6.25*height-5*age+(profile.sex==='Мужской'?5:-161);
 const tdee=bmr*factor;
 const goal=normalizeGoalLabel(plan.goal);
 let adjustment=Number(plan.energyAdjustment);
 if(!Number.isFinite(adjustment))adjustment=defaultGoalAdjustment(goal);
 if(goal==='Поддержание веса')adjustment=0;
 if(goal==='Снижение веса')adjustment=-Math.abs(adjustment||400);
 if(goal==='Набор веса')adjustment=Math.abs(adjustment||300);
 const kcal=Math.max(0,Math.round(tdee+adjustment));
 const training=profile.trainingFrequency&&profile.trainingFrequency!=='Нет регулярных тренировок';
 const proteinRate=Number(plan.proteinPerKg)|| (training?1.6:0.8);
 const protein=Math.max(0,Math.round(weight*proteinRate));
 const fatPercent=Math.min(35,Math.max(20,Number(plan.fatPercent)||30));
 const fat=Math.max(0,Math.round(kcal*fatPercent/100/9));
 const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
 return {age,weight,height,factor,bmr:Math.round(bmr),tdee:Math.round(tdee),adjustment,kcal,protein,fat,carbs,proteinRate,fatPercent,goal};
}
function syncPlanCalculations(persist=false){
 const result=calculatePlanTargets();if(!result)return null;
 plan.goal=result.goal;plan.energyAdjustment=result.adjustment;plan.kcal=result.kcal;plan.p=result.protein;plan.f=result.fat;plan.c=result.carbs;
 if(persist)savePlanData().catch(error=>reportPlanningOperationError('Не удалось сохранить план',error));
 return result;
}

function getDiaryFoodMetadata(entry){
 if(isMassSystemEntry(entry))return {categories:[],items:[]};
 if(entry?.foodMetadataSnapshot&&Array.isArray(entry.foodMetadataSnapshot.categories)&&Array.isArray(entry.foodMetadataSnapshot.items))return {categories:[...entry.foodMetadataSnapshot.categories],items:[...entry.foodMetadataSnapshot.items]};
 const product=entry.productId!==undefined&&entry.productId!==null?productDB.find(item=>String(item.id)===String(entry.productId)):productDB.find(item=>normalizeRecipeFilterValue(item.name)===normalizeRecipeFilterValue(entry.name));
 if(product)return {categories:recipeArray(product.categories),items:[product.name]};
 const recipe=entry.recipeId?recipes.find(item=>Number(item.id)===Number(entry.recipeId)):recipes.find(item=>normalizeRecipeFilterValue(item.name)===normalizeRecipeFilterValue(entry.name));
 if(!recipe)return {categories:[],items:[entry.name].filter(Boolean)};
 const seeded=RECIPE_FOOD_METADATA[recipe.id]||{categories:[],items:[]};
 let categories=[...seeded.categories,...recipeArray(recipe.categories),...recipeArray(recipe.foodCategories)];
 let items=[...seeded.items];
 recipeArray(recipe.ingredientItems).forEach(row=>{const product=productDB.find(item=>String(item.id)===String(row.productId));if(product){items.push(product.name);categories.push(...recipeArray(product.categories))}});
 const ingredientText=Array.isArray(recipe.ingredients)?recipe.ingredients.map(item=>typeof item==='string'?item:(item?.name||item?.productName||item?.title||'')).filter(Boolean).join(', '):String(recipe.ingredients||'');
 productDB.forEach(item=>{
  const shortName=item.name.toLocaleLowerCase('ru-RU').replace(/\s+\d.*$/,'');
  if(shortName.length>3&&ingredientText.toLocaleLowerCase('ru-RU').includes(shortName)){
   items.push(item.name);categories.push(...recipeArray(item.categories));
  }
 });
 if(!items.length&&ingredientText)items=ingredientText.split(/[,;]+/).map(value=>value.trim()).filter(Boolean);
 if(!items.length)items=[recipe.name];
 return {categories:uniqueProductValues(categories),items:uniqueProductValues(items)};
}
function plannerRecipeMatchesFoodGroup(recipe,groupId){
 const group=WEEKLY_FOOD_GROUPS.find(item=>item.id===groupId);if(!group)return false;
 const metadata=getDiaryFoodMetadata({recipeId:recipe.id,name:recipe.name});
 const recipeIngredientCategories=recipeArray(recipe.ingredientItems).flatMap(row=>{
  const product=productDB.find(item=>String(item.id)===String(row.productId));return product?recipeArray(product.categories):[];
 });
 const categories=uniqueProductValues([...metadata.categories,...recipeIngredientCategories,...recipeArray(recipe.categories),...recipeArray(recipe.foodCategories)]);
 return categories.some(category=>group.categories.some(expected=>normalizeRecipeFilterValue(expected)===normalizeRecipeFilterValue(category)));
}
function getCurrentWeekBounds(){const end=todayLocalDate(),start=new Date(end);start.setDate(start.getDate()-((start.getDay()+6)%7));const finish=new Date(start);finish.setDate(finish.getDate()+6);return {start:dateKey(start),end:dateKey(finish)}}
function getWeeklyFoodStats(){
 const bounds=getCurrentWeekBounds(),incompleteDates=new Set(diaryEntries.filter(isCalorieOnlyEntry).map(entry=>entry.date)),rows=diaryEntries.filter(entry=>entry.date>=bounds.start&&entry.date<=bounds.end&&!isMassSystemEntry(entry)&&!incompleteDates.has(entry.date));
 const stats={};WEEKLY_FOOD_GROUPS.forEach(group=>stats[group.id]={days:new Set(),items:new Set(),entries:0});
 rows.forEach(entry=>{
  const meta=getDiaryFoodMetadata(entry);
  WEEKLY_FOOD_GROUPS.forEach(group=>{
   const matched=meta.categories.some(category=>group.categories.some(expected=>normalizeRecipeFilterValue(expected)===normalizeRecipeFilterValue(category)));
   if(!matched)return;
   stats[group.id].days.add(entry.date);stats[group.id].entries++;
   meta.items.forEach(item=>stats[group.id].items.add(item));
  });
 });
 Object.keys(stats).forEach(id=>{stats[id].days=stats[id].days.size;stats[id].items=stats[id].items.size});
 return {bounds,stats};

function aggregatePlannerNutrition(weeks){
 const totals={kcal:0,p:0,f:0,c:0,fiber:0,sugar:0,sodium:0,cholesterol:0,potassium:0};
 const componentMap=new Map(),productNames=new Set();
 let recipeCount=0,unresolvedDishCount=0,missingProductCount=0,conversionIssueCount=0;
 (Array.isArray(weeks)?weeks:[]).forEach(week=>{
  recipeArray(week?.productIds).forEach(productId=>{
   const product=productDB.find(item=>String(item.id)===String(productId));
   if(product?.name)productNames.add(String(product.name).trim());
  });
  const dishes=[...(week?.mainDishes||[]),...(week?.snacks||[])].filter(dish=>dish?.recipeId);
  dishes.forEach(dish=>{
   recipeCount++;
   const recipe=recipes.find(item=>String(item.id)===String(dish.recipeId));
   if(!recipe){unresolvedDishCount++;return}
   const nutrition=recipeNutrition(recipe);
   Object.keys(totals).forEach(key=>{const value=Number(nutrition.total?.[key]);if(Number.isFinite(value))totals[key]+=value});
   missingProductCount+=nutrition.missingProducts.length;
   conversionIssueCount+=nutrition.conversionIssues.length;
   recipeArray(recipe.ingredientItems).forEach(row=>{
    const product=productDB.find(item=>String(item.id)===String(row.productId));
    const name=product?.name||row.productName||row.name;
    if(name)productNames.add(String(name).trim());
   });
   recipeArray(nutrition.components?.total).forEach(component=>{
    const name=String(component.name||'').trim(),unit=String(component.unit||'мг').trim();
    if(!name)return;
    const rdaUnit=PLAN_RDA_DATA.find(item=>normalizeRecipeFilterValue(item.name)===normalizeRecipeFilterValue(name))?.unit;
    const converted=rdaUnit?convertPlannerNutrientUnit(Number(component.amount)||0,unit,rdaUnit):null;
    const aggregateUnit=converted===null?unit:rdaUnit;
    const aggregateAmount=converted===null?(Number(component.amount)||0):converted;
    const key=`${normalizeRecipeFilterValue(name)}|${aggregateUnit.toLocaleLowerCase('ru-RU')}`;
    const current=componentMap.get(key)||{name,unit:aggregateUnit,amount:0};
    current.amount+=aggregateAmount;
    componentMap.set(key,current);
   });
  });
 });
 return {totals,components:[...componentMap.values()],productNames,recipeCount,unresolvedDishCount,missingProductCount,conversionIssueCount};
}
function plannerNutrientUnitFactorToMg(unit){
 const value=String(unit||'').trim().toLocaleLowerCase('ru-RU').replace(/\s+/g,'');
 if(value==='г'||value==='g')return 1000;
 if(value==='мг'||value==='mg')return 1;
 if(value==='мкг'||value==='µg'||value==='μg'||value==='mcg')return 0.001;
 return null;
}
function convertPlannerNutrientUnit(amount,fromUnit,toUnit){
 const from=String(fromUnit||'').trim(),to=String(toUnit||'').trim();
 if(from.toLocaleLowerCase('ru-RU')===to.toLocaleLowerCase('ru-RU'))return Number(amount)||0;
 const fromFactor=plannerNutrientUnitFactorToMg(from),toFactor=plannerNutrientUnitFactorToMg(to);
 if(fromFactor===null||toFactor===null)return null;
 return (Number(amount)||0)*fromFactor/toFactor;
}
function getPlannerRdaTarget(nutrientName){

 if(!match)return null;
 const age=calculateProfileAge(profile.birthDate);
 if(age===null||age<9)return null;
 if(!['Мужской','Женский'].includes(profile.sex))return null;
 const values=match.v[getRdaAgeBand(age)];
 if(!values)return null;
 return {value:Number(values[profile.sex==='Мужской'?0:1]),unit:match.unit,kind:match.kind};
}
function getPlannerMicronutrientView(aggregate,days){
 const components=(aggregate?.components||[]).map(item=>{
  const dailyAmount=(Number(item.amount)||0)/Math.max(1,days);
  const target=getPlannerRdaTarget(item.name);
  const comparable=target?convertPlannerNutrientUnit(dailyAmount,item.unit,target.unit):null;
  const percent=comparable!==null&&target?.value>0?Math.round(comparable/target.value*100):null;
  return {...item,dailyAmount,target,percent};
 });
 const vitaminRows=components.filter(item=>/витамин|фолат|биотин/i.test(item.name));
 const mineralRows=components.filter(item=>!(/витамин|фолат|биотин/i.test(item.name)));
 const coverage=components.filter(item=>Number.isFinite(item.percent));
 const averageCoverage=coverage.length?Math.round(coverage.reduce((sum,item)=>sum+item.percent,0)/coverage.length):null;
 return {vitaminRows,mineralRows,averageCoverage,hasData:components.length>0,components};
}

   <div class="theory-document-content">
    <article class="theory-chapter" id="theory-energy">
     <div class="theory-chapter-number">01 · ЭНЕРГЕТИЧЕСКИЙ ОБМЕН</div>
     <h3>Как рассчитывается расход энергии</h3>
     <p>Расчёт состоит из двух этапов: сначала оценивается базовый обмен веществ (BMR), затем учитывается повседневная активность для получения общего суточного расхода энергии (TDEE).</p>
     <h4>Базовый обмен веществ — BMR</h4>
     <p>BMR — оценка энергии, которую организм расходует в состоянии покоя для поддержания основных функций. В приложении используется формула Mifflin–St Jeor.</p>
     <div class="theory-formula-list">
      <div class="theory-formula"><span>Мужчины</span><strong>BMR = 10 × вес + 6,25 × рост − 5 × возраст + 5</strong></div>
      <div class="theory-formula"><span>Женщины</span><strong>BMR = 10 × вес + 6,25 × рост − 5 × возраст − 161</strong></div>
     </div>
     <p class="theory-definition"><strong>Переменные:</strong> вес указывается в килограммах, рост — в сантиметрах, возраст — в полных годах. Результат выражается в килокалориях в сутки.</p>
     <h4>Общий суточный расход — TDEE</h4>
     <p>TDEE оценивает общий расход энергии с учётом привычной активности.</p>
     <div class="theory-formula theory-formula-single"><span>Формула</span><strong>TDEE = BMR × коэффициент активности</strong></div>
     <table class="data-table theory-table"><thead><tr><th>Уровень активности</th><th>Коэффициент</th></tr></thead><tbody><tr><td>Минимальная</td><td>1,20</td></tr><tr><td>Низкая</td><td>1,375</td></tr><tr><td>Умеренная</td><td>1,55</td></tr><tr><td>Высокая</td><td>1,725</td></tr><tr><td>Очень высокая</td><td>1,90</td></tr></tbody></table>
     <div class="theory-note"><strong>Как учитываются тренировки</strong><p>Коэффициент активности должен отражать обычный образ жизни в целом, включая регулярные тренировки. Поэтому отдельные калории каждой тренировки повторно к TDEE не прибавляются — это помогло бы избежать двойного учёта.</p></div>
     <p class="theory-caveat">Это расчётная оценка, а не прямое измерение обмена веществ. Реальные потребности могут отличаться; оценку уточняют по динамике веса и самочувствию. Формула опубликована в исследовании <a href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener">Mifflin et al., 1990</a>; исходная выборка включала взрослых 19–78 лет.</p>
    </article>
    <article class="theory-chapter" id="theory-adjustment">
     <div class="theory-chapter-number">02 · ЦЕЛЕВАЯ ЭНЕРГИЯ</div>
     <h3>Принцип корректировки калорий</h3>
     <p>Целевое потребление рассчитывается относительно TDEE. Выбранная цель определяет, будет ли план совпадать с расходом, создавать дефицит или профицит энергии.</p>
     <div class="theory-adjustment-grid">
      <div class="theory-adjustment-item"><strong>Поддержание веса</strong><p>Целевое потребление примерно соответствует TDEE.</p></div>
      <div class="theory-adjustment-item"><strong>Снижение веса</strong><p>Целевое потребление ниже TDEE: создаётся дефицит энергии.</p></div>
      <div class="theory-adjustment-item"><strong>Набор веса</strong><p>Целевое потребление выше TDEE: создаётся профицит энергии.</p></div>
     </div>
     <h4>Стартовые значения приложения</h4>
     <p>В текущей настройке для снижения веса используется стартовая корректировка −400 ккал в сутки, для набора — +300 ккал в сутки. Для поддержания корректировка равна нулю. Эти значения являются отправной точкой, а не универсальным предписанием.</p>
     <p>Изменение веса оценивают по тенденции за время, а не по отдельному взвешиванию. При необходимости целевую калорийность корректируют в настройке плана.</p>
     <div class="theory-note"><strong>Распределение макронутриентов</strong><p>После определения целевой калорийности приложение рассчитывает белки и жиры по выбранным настройкам. Углеводы получают оставшуюся энергетическую долю. Подробнее о диапазонах и основаниях выбора смотри в описаниях соответствующих рекомендаций ниже и в настройке плана.</p></div>
    </article>
    <article class="theory-chapter" id="theory-macros">
     <div class="theory-chapter-number">03 · МАКРОНУТРИЕНТЫ</div>
     <h3>Как рассчитываются белки, жиры и углеводы</h3>
     <p>После определения целевой калорийности дневной план распределяет энергию между тремя макронутриентами. В настройках плана пользователь может выбрать количество белка на килограмм веса и долю энергии, выделяемую жирам.</p>
     <h4>Белки</h4>
     <div class="theory-formula theory-formula-single"><span>Формула</span><strong>Белок, г/сутки = масса тела, кг × выбранная норма, г/кг</strong></div>
     <p>Для взрослых базовый ориентир потребности в белке составляет около 0,8 г/кг в сутки. Для физически тренирующихся людей в спортивных рекомендациях часто приводится диапазон 1,4–2,0 г/кг в сутки. Конкретная потребность зависит от характера и объёма нагрузки, возраста, общей калорийности и других факторов.</p>
     <p>Текущая автоматическая логика прототипа упрощена: при отсутствии регулярных тренировок она выбирает 0,8 г/кг, а при наличии регулярных тренировок — 1,6 г/кг. Это стартовый ориентир приложения, а не индивидуальное назначение. В настройках плана можно выбрать значение вручную: от 0,8 до 2,0 г/кг с шагом 0,2 г/кг.</p>
     <h4>Жиры</h4>
     <p>Для взрослых допустимый диапазон распределения энергии из общего количества жиров (AMDR) составляет 20–35% суточной энергии. В прототипе 30% выбраны как стартовое значение внутри этого диапазона. Это не обязательная норма и не утверждение, что 30% оптимальны для каждого человека: долю можно изменить в настройках плана на 20%, 25%, 30% или 35%.</p>
     <div class="theory-formula theory-formula-single"><span>Перевод доли энергии в граммы</span><strong>Жиры, г = целевые ккал × доля жиров ÷ 100 ÷ 9</strong></div>
     <p>Для расчёта используется энергетическая ценность около 9 ккал на грамм жира.</p>
     <h4>Углеводы</h4>
     <p>После расчёта энергии из белков и жиров оставшаяся часть целевой калорийности отводится углеводам.</p>
     <div class="theory-formula theory-formula-single"><span>Формула</span><strong>Углеводы, г = (целевые ккал − белки, г × 4 − жиры, г × 9) ÷ 4</strong></div>
     <p>Для белков и углеводов в расчёте используется около 4 ккал на грамм. Поэтому значение углеводов зависит от общей цели по калориям, веса, выбранной нормы белка и доли жиров.</p>
     <div class="theory-note"><strong>Что важно понимать</strong><p>30% жиров и автоматические 0,8/1,6 г/кг белка — стартовые настройки текущего прототипа. Они не должны восприниматься как универсальная рекомендация для любого человека. Ручная настройка позволяет изменить распределение; оценивать подходящесть плана следует с учётом состояния здоровья, типа нагрузки и динамики результатов.</p></div>
     <h4>Источники и справочные основания</h4>
     <ul class="theory-list"><li><a href="https://onlinelibrary.wiley.com/doi/10.2903/j.efsa.2012.2557/full" target="_blank" rel="noopener">EFSA: Dietary Reference Values for protein</a> — PRI для здоровых взрослых около 0,83 г/кг в сутки.</li><li><a href="https://pubmed.ncbi.nlm.nih.gov/28642676/" target="_blank" rel="noopener">ISSN Position Stand: Protein and Exercise</a> — диапазон 1,4–2,0 г/кг для большинства тренирующихся людей.</li><li><a href="https://www.nationalacademies.org/read/27957/chapter/5" target="_blank" rel="noopener">National Academies: AMDR</a> — диапазон жиров 20–35% энергии для взрослых.</li></ul>
    </article>
    <article class="theory-chapter" id="theory-nutrients">
     <div class="theory-chapter-number">04 · МИКРОНУТРИЕНТЫ</div>
     <h3>Рекомендуемые нормы витаминов и минералов</h3>
     <p>Таблица показывает рекомендуемое суточное количество нутриентов для возрастной и половой группы, определённой по данным Профиля. Нормы основаны на Dietary Reference Intakes (DRI) National Academies и справочниках NIH Office of Dietary Supplements.</p>
     <h4>Как читать значения</h4>
     <ul class="theory-list"><li><strong>RDA</strong> — рекомендуемая суточная норма, рассчитанная для покрытия потребности почти всех здоровых людей соответствующей группы.</li><li><strong>AI</strong> — адекватное потребление. Используется, когда имеющихся данных недостаточно для установления RDA.</li></ul>
     <p>Значение относится к суммарному поступлению за сутки. Это не расписание приёма по часам и не рекомендация принимать отдельные добавки. Нутриенты могут поступать из разных продуктов в течение дня.</p>
     <p>Рекомендуемые значения не меняются при выборе поддержания, снижения или набора веса. Норма относится к суммарному поступлению за день, а не к конкретному времени приёма пищи. Фактическое поступление из продуктов оценивается отдельно в Статистике.</p>
     <p class="theory-caveat">Справочник основан на Dietary Reference Intakes National Academies; обзор таблиц доступен в <a href="https://ods.od.nih.gov/HealthInformation/nutrientrecommendations.aspx" target="_blank" rel="noopener">NIH Office of Dietary Supplements</a>.</p>
     <div class="theory-reference-table">${rdaMarkup}</div>
     <p class="theory-caveat">Справочные нормы предназначены для здоровых людей и не заменяют индивидуальные медицинские рекомендации. При отсутствии даты рождения или других необходимых данных таблица не может подобрать персональную возрастную группу.</p>
    </article>
    <article class="theory-chapter" id="theory-completeness">
     <div class="theory-chapter-number">05 · СТРУКТУРА РАЦИОНА</div>
     <h3>Полнота питания</h3>
     <p>Полнота в приложении означает, насколько регулярно в рацион включаются разные группы продуктов. Недельный блок Планирования сопоставляет записи Дневника со справочными ориентирами и личными целями пользователя.</p>
     <table class="data-table theory-table"><thead><tr><th>Группа продуктов</th><th>Справочный ориентир</th></tr></thead><tbody>${weeklyReferenceRows}</tbody></table>
     <h4>Как группируются источники белка</h4>
     <p>«Источники белка» — аналитическая группа для недельного обзора. Она собирается из молочных продуктов, бобовых, рыбы, орехов, мяса, птицы и яиц. Это не отдельная категория продукта в каталоге.</p>
     <h4>Личные ориентиры</h4>
     <p>Пользователь может задать собственные ориентиры полноты и разнообразия по группам продуктов. Личные значения отображаются отдельно и не изменяют справочные ориентиры.</p>
    </article>
    <article class="theory-chapter" id="theory-variety">
     <div class="theory-chapter-number">06 · РАЗНООБРАЗИЕ</div>
     <h3>Разнообразие питания</h3>
     <p>Разнообразие означает, что внутри каждой группы продуктов используются разные продукты, а не один и тот же вариант постоянно.</p>
     <p>Например, для овощей учитывается не только факт их употребления, но и количество различных овощей, встречавшихся в записях за неделю: морковь, свёкла, брокколи и другие.</p>
     <p>В недельном блоке приложение считает уникальные продукты внутри каждой группы. Если пользователь задаёт собственную цель разнообразия, результат сопоставляется с этим количеством.</p>
     <p>Личные цели разнообразия независимы от справочных ориентиров полноты питания. Оба показателя видны отдельно в практическом недельном обзоре Планирования.</p>
    </article>

 if(e.key==='Tab'){
  const modal=document.querySelector('.modal');
  const focusable=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
  if(!focusable.length){e.preventDefault();modal.focus();return}
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});

function productBasisUnit(product){return product?.basisUnit==='мл'?'мл':'г'}
function ingredientAmountInProductBasis(row,product){
 const amount=Math.max(0,Number(row?.amount??row?.grams)||0);
 const enteredUnit=row?.unit||(row?.grams!==undefined?'г':productBasisUnit(product));
 const basis=productBasisUnit(product);
 if(enteredUnit===basis)return {amount,valid:true,basis};
 const density=Number(product?.density);
 if(!Number.isFinite(density)||density<=0)return {amount:null,valid:false,basis,enteredUnit};

 const out=[];const val=n=>measurementValue(n,values);const add=(label,value,detail)=>{if(value!==null&&value!==undefined&&value!=='')out.push({label,value,detail})};
 const pairs=[['Бицепс','Бицепс — левая рука','Бицепс — правая рука'],['Предплечье','Предплечье — левая рука','Предплечье — правая рука'],['Бедро','Бедро — левая нога','Бедро — правая нога'],['Икра','Икра — левая нога','Икра — правая нога']];
 pairs.forEach(([label,leftName,rightName])=>{const a=val(leftName),b=val(rightName),d=symmetryDifference(a,b);if(d)add(`${label}: левая / правая`,`${d.cm.toFixed(1).replace('.',',')} см`,`Разница ${d.percent.toFixed(1).replace('.',',')}% · ${a.toFixed(1).replace('.',',')} / ${b.toFixed(1).replace('.',',')} см`)});
 const avg=(a,b)=>a&&b?(a+b)/2:null;
 const arm=ratioPercent(avg(val('Бицепс — левая рука'),val('Бицепс — правая рука')),avg(val('Предплечье — левая рука'),val('Предплечье — правая рука')));
 const leg=ratioPercent(avg(val('Бедро — левая нога'),val('Бедро — правая нога')),avg(val('Икра — левая нога'),val('Икра — правая нога')));
 add('Бицепс / предплечье',arm===null?null:`${arm.toFixed(1).replace('.',',')}%`,'Среднее значение по обеим рукам');
 add('Бедро / икра',leg===null?null:`${leg.toFixed(1).replace('.',',')}%`,'Среднее значение по обеим ногам');
 const shoulderWaist=ratioPercent(val('Плечи'),val('Талия'));const waistHips=ratioPercent(val('Талия'),val('Бёдра'));const measureHeight=Number(values?.height)||Number(profile.height);const waistHeight=ratioPercent(val('Талия'),measureHeight>0?measureHeight:null);
 add('Плечи / талия',shoulderWaist===null?null:`${shoulderWaist.toFixed(1).replace('.',',')}%`,'Соотношение объёма плеч и талии');
 add('Талия / бёдра',waistHips===null?null:`${waistHips.toFixed(1).replace('.',',')}%`,'Отношение окружности талии к бёдрам');
 add('Талия / рост',waistHeight===null?null:`${waistHeight.toFixed(1).replace('.',',')}%`,'Ориентир: менее 50% роста');
 return out;
}
function buildMeasurementCardRatios(values={...Object.fromEntries(measurements.map(m=>[m.name,m.value])),height:profile.height}){
 const val=name=>measurementValue(name,values);const avg=(a,b)=>a&&b?(a+b)/2:null;const rows=[];
 const add=(label,value)=>{if(value!==null&&Number.isFinite(value)&&value>0)rows.push({label,value:`${value.toFixed(1).replace('.',',')}%`})};
 add('Талия / рост',ratioPercent(val('Талия'),Number(values.height||profile.height)>0?Number(values.height||profile.height):null));
 add('Талия / бёдра',ratioPercent(val('Талия'),val('Бёдра')));
 add('Плечи / талия',ratioPercent(val('Плечи'),val('Талия')));
 add('Бицепс / предплечье',ratioPercent(avg(val('Бицепс — левая рука'),val('Бицепс — правая рука')),avg(val('Предплечье — левая рука'),val('Предплечье — правая рука'))));
 add('Бедро / икра',ratioPercent(avg(val('Бедро — левая нога'),val('Бедро — правая нога')),avg(val('Икра — левая нога'),val('Икра — правая нога'))));
 return rows;
}
function measurementCardSummary(){
 const rows=buildMeasurementCardRatios();
 const height=Number(profile.height)>0?`${Number(profile.height).toLocaleString(localeTags(),{maximumFractionDigits:1})} см`:'—';
 const shortLabels={'Бицепс / предплечье':'Бицепс / предпл.'};
 return `<div class="measure-ratio-summary"><div class="measure-ratio-item"><span>Рост</span><b>${height}</b></div>${rows.map(r=>`<div class="measure-ratio-item"><span>${shortLabels[r.label]||r.label}</span><b>${r.value}</b></div>`).join('')}</div>`;
}
function openMeasureModal(editDate=null){
 const snapshot=editDate?measurementHistory.find(x=>x.date===editDate):null;
 const latestMeasurementDate=measurementHistory.length?[...measurementHistory].sort((a,b)=>b.date.localeCompare(a.date))[0].date:null;const values=snapshot?{...snapshot.values,height:snapshot.date===latestMeasurementDate?profile.height:(Number(snapshot.values?.height)||profile.height)}:{...Object.fromEntries(measurements.map(m=>[m.name,m.value])),height:profile.height};
 const date=snapshot?snapshot.date:dateKey(todayLocalDate());
 const ratioMarkup=buildMeasurementRatios(values).map(r=>`<div class="ratio-card"><strong>${r.label}</strong><b>${r.value}</b><small>${r.detail}</small></div>`).join('')||'<div class="history-empty">Пока недостаточно данных для расчётов</div>';
 const body=NutriMealUI.renderMeasurementModalBody({
  today:dateKey(todayLocalDate()),
  date,
  profileHeight:profile.height,
  values,
  measurements,
  ratioMarkup
 });
 openModal(snapshot?'Изменить замеры':'Замеры тела',body,`<button class="btn" id="measure-history">История замеров</button><div style="display:flex;gap:8px;margin-left:auto"><button class="btn" id="measure-cancel">Отмена</button><button class="btn-primary" id="measure-save">Сохранить</button></div>`);
 document.querySelector('.modal').classList.add('measurements-modal');
 const updateRatios=()=>{const current=Object.fromEntries(measurements.map(m=>[m.name,Number(document.querySelector(`[data-measure-name="${m.name}"]`)?.value)||null]));current.height=Number(document.getElementById('measure-height')?.value)||null;const ratios=buildMeasurementRatios(current);document.getElementById('measure-ratios').innerHTML=ratios.length?ratios.map(r=>`<div class="ratio-card"><strong>${r.label}</strong><b>${r.value}</b><small>${r.detail}</small></div>`).join(''):'<div class="history-empty">Пока недостаточно данных для расчётов</div>'};
 document.querySelectorAll('[data-measure-name]').forEach(input=>input.addEventListener('input',updateRatios));document.getElementById('measure-height').addEventListener('input',updateRatios);
 document.getElementById('measure-cancel').onclick=closeModal;document.getElementById('measure-history').onclick=openMeasurementHistoryModal;
 document.getElementById('measure-save').onclick=async()=>{
  const chosenDate=document.getElementById('measure-date').value;if(!chosenDate||chosenDate>dateKey(todayLocalDate())){toast('Выбери сегодняшнюю или прошедшую дату');return}
  const next={};let invalid=false,filled=0;
  const heightRaw=document.getElementById('measure-height').value.trim(),heightValue=Number(heightRaw);if(!heightRaw||!Number.isFinite(heightValue)||heightValue<80||heightValue>250){toast('Укажи корректный рост от 80 до 250 см');return}next.height=heightValue;filled++;
  measurements.forEach(m=>{const input=document.querySelector(`[data-measure-name="${m.name}"]`),raw=input.value.trim(),n=Number(raw);if(raw===''){next[m.name]=null}else if(!Number.isFinite(n)||n<=0||n>300){invalid=true}else{next[m.name]=n;filled++}});
  if(invalid){toast('Проверь значения замеров: допустимы числа от 0 до 300 см');return}
  if(!filled){toast('Введи хотя бы один замер');return}
  try{
   const result=await saveMeasurementSnapshot(chosenDate,next);
   measurementHistory=result.history;measurements=result.measurements;profile=result.profile;
   closeModal();render();toast('Замеры сохранены');
  }catch(error){console.error('Не удалось сохранить замеры',error);toast(error instanceof Error?error.message:'Не удалось сохранить замеры')}
 };
}
function openMeasurementHistoryModal(){
 const rows=[...measurementHistory].sort((a,b)=>b.date.localeCompare(a.date));
 const body=NutriMealUI.renderMeasurementHistoryBody({history:rows,readableDate});
 openModal('История замеров',`<div class="field-help" style="margin-bottom:12px">Выбери дату, чтобы открыть и при необходимости отредактировать сохранённые значения.</div>${body}`,`<button class="btn" id="measure-history-close">Закрыть</button><button class="btn-primary" id="measure-history-add">Добавить замер</button>`);
 document.getElementById('measure-history-close').onclick=closeModal;document.getElementById('measure-history-add').onclick=()=>openMeasureModal();document.querySelectorAll('[data-edit-measure-date]').forEach(b=>b.onclick=()=>openMeasureModal(b.dataset.editMeasureDate));document.querySelectorAll('[data-delete-measure-date]').forEach(b=>b.onclick=()=>deleteMeasurementSnapshot(b.dataset.deleteMeasureDate));
}
function openProfileModal(){
 const draft={...profile,trainingDays:[...(profile.trainingDays||[])],allergies:[...(profile.allergies||[])],foodRestrictions:[...(profile.foodRestrictions||[])]};
 const activityOptions=PROFILE_ACTIVITY_LEVELS;
 const trainingOptions=['Нет регулярных тренировок','1–2 раза в неделю','3–4 раза в неделю','5–6 раз в неделю','Каждый день'];
 const profileAge=calculateProfileAge(draft.birthDate);
 draft.today=dateKey(todayLocalDate());
 const body=NutriMealUI.renderProfileModalBody({
  draft,
  activityOptions,
  trainingOptions,
  weekdays:PROFILE_WEEKDAYS,
  age:profileAge,
  ageNote:profileAge===null?'Укажи дату рождения':'лет',
  formatActivityFactor,
  escapeHtml,
  tokenEditorMarkup:profileTokenEditorMarkup
 });
 openModal('Персональные параметры',body,`<button class="btn" id="profile-cancel">Отмена</button><button class="btn-primary" id="profile-save">Сохранить</button>`);
 document.querySelector('.modal').classList.add('profile-edit-modal');
 const updateAgePreview=()=>{const age=calculateProfileAge(document.getElementById('profile-birth-date').value);document.getElementById('profile-age-preview').innerHTML=`<strong>${age===null?'—':age}</strong><span>${age===null?'Укажи корректную дату рождения':'лет'}</span>`};
 document.getElementById('profile-birth-date').addEventListener('input',updateAgePreview);
 const paintTrainingDays=()=>{
  const noTraining=document.getElementById('profile-training-frequency').value==='Нет регулярных тренировок';
  document.querySelectorAll('[data-training-day]').forEach(button=>{const active=draft.trainingDays.includes(button.dataset.trainingDay);button.classList.toggle('selected',active);button.setAttribute('aria-pressed',String(active));button.disabled=noTraining});
  document.getElementById('profile-training-days-help').textContent=noTraining?'Выбери частоту тренировок, чтобы отметить обычные дни.':'Выбери дни недели, в которые обычно тренируешься. Это расписание профиля, не учёт отдельных тренировок.';
 };
 document.getElementById('profile-training-frequency').addEventListener('change',()=>{if(document.getElementById('profile-training-frequency').value==='Нет регулярных тренировок')draft.trainingDays=[];paintTrainingDays()});
 document.querySelectorAll('[data-training-day]').forEach(button=>button.addEventListener('click',()=>{const day=button.dataset.trainingDay;if(draft.trainingDays.includes(day))draft.trainingDays=draft.trainingDays.filter(item=>item!==day);else draft.trainingDays.push(day);paintTrainingDays()}));
 const selectedValues=type=>type==='allergies'?draft.allergies:draft.foodRestrictions;
 const setSelectedValues=(type,values)=>{if(type==='allergies')draft.allergies=values;else draft.foodRestrictions=values};
 const suggestionsFor=(type,query)=>{
  const base=type==='allergies'?profileAllergenSuggestions():draft.foodRestrictions;
  const selected=selectedValues(type).map(value=>String(value).toLocaleLowerCase('ru-RU'));
  const q=query.trim().toLocaleLowerCase('ru-RU');
  return uniqueProductValues(base).filter(value=>!selected.includes(value.toLocaleLowerCase('ru-RU'))&&(!q||value.toLocaleLowerCase('ru-RU').includes(q))).slice(0,8);
 };
 const paintTokenEditor=type=>{
  const input=document.getElementById(`profile-${type}-input`),suggestions=document.getElementById(`profile-${type}-suggestions`),selected=document.getElementById(`profile-${type}-selected`);if(!input||!suggestions||!selected)return;
  const query=input.value.trim(),matches=suggestionsFor(type,query),exact=selectedValues(type).some(value=>value.toLocaleLowerCase('ru-RU')===query.toLocaleLowerCase('ru-RU'));
  suggestions.innerHTML=matches.map(value=>`<button type="button" class="profile-token-suggestion" data-profile-token-pick="${type}" data-value="${escapeHtml(value)}">${escapeHtml(value)}</button>`).join('');
  if(query&&!exact&&!matches.some(value=>value.toLocaleLowerCase('ru-RU')===query.toLocaleLowerCase('ru-RU')))suggestions.innerHTML+=`<button type="button" class="profile-token-suggestion create" data-profile-token-pick="${type}" data-value="${escapeHtml(query)}">＋ Создать «${escapeHtml(query)}»</button>`;
  selected.innerHTML=profileTokenChipMarkup(selectedValues(type),type);
 };
 const addToken=(type,value)=>{
  const clean=String(value||'').trim();if(!clean)return;
  const values=selectedValues(type);if(!values.some(item=>item.toLocaleLowerCase('ru-RU')===clean.toLocaleLowerCase('ru-RU')))values.push(clean);
  setSelectedValues(type,values);const input=document.getElementById(`profile-${type}-input`);input.value='';paintTokenEditor(type);input.focus();
 };
 ['allergies','foodRestrictions'].forEach(type=>{
  const input=document.getElementById(`profile-${type}-input`),addButton=document.getElementById(`profile-${type}-add`);
  input.addEventListener('input',()=>paintTokenEditor(type));
  input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();const query=input.value.trim(),match=suggestionsFor(type,query).find(value=>value.toLocaleLowerCase('ru-RU')===query.toLocaleLowerCase('ru-RU'));addToken(type,match||query)}});
  addButton.addEventListener('click',()=>addToken(type,input.value));
  paintTokenEditor(type);
 });
 document.getElementById('modal-body').onclick=event=>{
  const pick=event.target.closest('[data-profile-token-pick]');
  if(pick){addToken(pick.dataset.profileTokenPick,pick.dataset.value);return}
  const remove=event.target.closest('[data-profile-token-remove]');
  if(remove){const type=remove.dataset.profileTokenRemove,index=Number(remove.dataset.index),values=selectedValues(type);values.splice(index,1);setSelectedValues(type,values);paintTokenEditor(type)}
 };
 paintTrainingDays();
 document.getElementById('profile-cancel').onclick=closeModal;
 document.getElementById('profile-save').onclick=async()=>{
  const birthDate=document.getElementById('profile-birth-date').value;
  const age=calculateProfileAge(birthDate);
  const height=Number(document.getElementById('profile-height').value),weight=Number(document.getElementById('profile-weight').value),mealCount=Number(document.getElementById('profile-meal-count').value);
  if(birthDate&&(age===null||age<10||age>120)){toast('Проверь дату рождения: возраст должен быть от 10 до 120 лет');return}
  if(!Number.isFinite(height)||height<80||height>250){toast('Укажи рост от 80 до 250 см');return}
  if(!Number.isFinite(weight)||weight<=0||weight>500){toast('Проверь текущий вес');return}
  if(!Number.isInteger(mealCount)||mealCount<1||mealCount>6){toast('Укажи от 1 до 6 стандартных приёмов пищи');return}
  const previousProfile=profile,heightChanged=height!==profile.height;
  let nextProfile={
   ...profile,
   sex:document.getElementById('profile-sex').value,
   birthDate,
   height,
   currentWeight:weight,
   activityFactor:Number(document.getElementById('profile-activity-factor').value)||1.20,
   trainingFrequency:document.getElementById('profile-training-frequency').value,
   trainingDays:document.getElementById('profile-training-frequency').value==='Нет регулярных тренировок'?[]:PROFILE_WEEKDAYS.filter(day=>draft.trainingDays.includes(day)),
   allergies:uniqueProductValues(draft.allergies),
   foodRestrictions:uniqueProductValues(draft.foodRestrictions),
   mealCount
  };
  try{
   if(weight!==previousProfile.currentWeight){
    const result=await saveWeightRecordThroughUseCase(weight,dateKey(todayLocalDate()),null,nextProfile);
    weightHistory=result.history;nextProfile={...result.profile,currentWeight:weight};profile=nextProfile;
   }
   if(heightChanged&&measurementHistory.length){
    const latest=[...measurementHistory].sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(latest){
     const result=await saveMeasurementSnapshot(latest.date,{...latest.values,height},nextProfile);
     measurementHistory=result.history;measurements=result.measurements;nextProfile=result.profile;profile=nextProfile;
    }
   }
   profile=nextProfile;
   saveProfileData();syncPlanCalculations(true);closeModal();renderProfile();toast('Персональные параметры обновлены');
  }catch(error){console.error('Не удалось сохранить персональные параметры',error);toast(error instanceof Error?error.message:'Не удалось сохранить персональные параметры')}
 };
}
